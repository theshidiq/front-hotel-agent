# fly.toml app configuration file generated for front-hotel-agent-api on 2026-02-13T14:37:16+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'front-hotel-agent-api'
primary_region = 'nrt'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  CORS_ORIGINS = "https://sinara.app"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
